name: Fare worker rotation

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: fare-worker-rotation
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rotate:
    name: Plan and scan due fares
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      FLI_SOCS_COOKIE: ${{ secrets.FLI_SOCS_COOKIE }}
      FARE_PLANNING_LIMIT_PER_WATCH: "60"
      FARE_SCAN_BATCH_SIZE: "3"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: worker/pyproject.toml

      - name: Verify required configuration
        shell: bash
        run: |
          test -n "$NEXT_PUBLIC_SUPABASE_URL"
          test -n "$SUPABASE_SECRET_KEY"

      - name: Install worker
        run: python -m pip install ./worker

      - name: Run one bounded rotation
        run: python -m fare_worker.rotating_flow
