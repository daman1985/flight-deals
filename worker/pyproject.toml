[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "cross-cabin-fare-worker"
version = "0.1.0"
description = "Provider-isolated fare acquisition worker for Flight Deals"
requires-python = ">=3.10,<3.14"
dependencies = [
  "flights @ git+https://github.com/punitarani/fli.git@881aee5ff4321e81ea2157cb44be94ce6a21dc1b",
  "httpx==0.28.1",
  "pydantic==2.13.5",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
fare-worker-proof = "fare_worker.controlled_flow:main"

[tool.hatch.build.targets.wheel]
packages = ["fare_worker"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
